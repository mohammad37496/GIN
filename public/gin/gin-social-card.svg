  <circle cx="960" cy="315" r="330" fill="none" stroke="#C5D5DF" stroke-opacity=".09" stroke-width="2"/>
  <circle cx="960" cy="315" r="260" fill="none" stroke="#C5D5DF" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="960" cy="315" r="190" fill="none" stroke="#C5D5DF" stroke-opacity=".07" stroke-width="2"/>
