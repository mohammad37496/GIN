<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">GIN — Global Information Network</title>
  <desc id="description">Global Information Network. Learn, Connect, Grow.</desc>
  <defs>
