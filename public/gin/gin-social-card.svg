    <path d="M23 64h82M31 43h66M31 85h66" stroke="#C5D5DF" stroke-opacity=".46" stroke-width="1.7"/>
    <path d="M41 91 58 72l17 8 16-25" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g fill="#E8CE91"><circle cx="41" cy="91" r="4.5"/><circle cx="58" cy="72" r="4.5"/><circle cx="75" cy="80" r="4.5"/><circle cx="91" cy="55" r="4.5"/><circle cx="64" cy="21" r="3.5"/><circle cx="107" cy="64" r="3.5"/></g>
